# Render Blueprint: two Docker services from the same repo
# Backend and frontend each use their own Dockerfile via rootDir + dockerfilePath.
# Do not point Render at docker-compose.yml — it is for local dev only.

services:
  # Backend (FastAPI)
  - type: web
    runtime: docker
    name: arckae-backend
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arckae-db
          property: connectionString
      # Add your frontend URL after first deploy (e.g. https://arckae-frontend-xxxx.onrender.com)
      - key: CORS_ORIGINS
        sync: false

  # Frontend (nginx serving SPA, proxies /api to backend)
  - type: web
    runtime: docker
    name: arckae-frontend
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: arckae-backend
          type: web
          property: hostport

databases:
  - name: arckae-db
    databaseName: arckae
    plan: free
